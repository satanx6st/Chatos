# Deploys the ./site folder to GitHub Pages.
# Also runs every Monday to refresh the diesel price used by the Quick Estimate.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 14 * * 1"   # Mondays, about 7 AM Pacific
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Weekly California retail diesel price from the U.S. Energy Information Administration.
      # Needs a free EIA API key saved as the repo secret EIA_API_KEY.
      # If the key is missing or the call fails, the price already in site/assets/data/fuel.json is kept.
      - name: Update diesel price
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          if [ -z "$EIA_API_KEY" ]; then echo "No EIA_API_KEY secret, keeping current site/assets/data/fuel.json"; exit 0; fi
          URL="https://api.eia.gov/v2/petroleum/pri/gnd/data/?api_key=${EIA_API_KEY}&frequency=weekly&data[0]=value&facets[series][]=EMD_EPD2D_PTE_SCA_DPG&sort[0][column]=period&sort[0][direction]=desc&length=1"
          if curl -sf -g "$URL" -o eia.json; then
            python3 - <<'PY'
          import json, sys
          d = json.load(open("eia.json"))["response"]["data"]
          if not d:
              sys.exit(0)
          v, period = float(d[0]["value"]), d[0]["period"]
          if 2 < v < 15:
              json.dump({"dieselPerGallon": round(v, 2), "updated": period, "source": "EIA weekly California No. 2 diesel retail price"},
                        open("site/assets/data/fuel.json", "w"), indent=2)
              print("Diesel price set to", v, "for week", period)
          PY
          else
            echo "EIA request failed, keeping current site/assets/data/fuel.json"
          fi
          rm -f eia.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
